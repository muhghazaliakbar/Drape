name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # A release that has not passed its own tests is not a release.
      - name: Test
        run: |
          xcodebuild test \
            -project Drape.xcodeproj \
            -scheme Drape \
            -destination 'platform=macOS'

      - name: Check the tag against the project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(xcodebuild -project Drape.xcodeproj -scheme Drape \
            -configuration Release -showBuildSettings 2>/dev/null \
            | awk '/ MARKETING_VERSION = /{print $3}' | head -1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION" >&2
            exit 1
          fi

      - name: Package
        run: Tools/package-release.sh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls dist/*.dmg)
          # The release notes are the annotated tag's own message. It has to come
          # from the API: actions/checkout leaves behind a lightweight tag pointing
          # at the commit, so `git tag -l --format=%(contents)` returns the commit
          # message instead — which is how the first v0.1.0 notes went out wrong.
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(jq -r .object.type <<<"$REF")" != "tag" ]; then
            echo "$GITHUB_REF_NAME is a lightweight tag; releases need an annotated one" >&2
            echo "  git tag -a $GITHUB_REF_NAME --cleanup=verbatim" >&2
            exit 1
          fi
          {
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$REF")" --jq .message
            echo
            echo '### Install'
            echo
            echo "Download the disk image, drag **Drape** into Applications, and open it."
            echo "It lives in the menu bar — there is no Dock icon."
            echo
            echo "The build is ad-hoc signed but **not notarised**, so the first launch is refused."
            echo "Open **System Settings → Privacy & Security**, scroll to Security, and press"
            echo "**Open Anyway** next to Drape. macOS asks once."
            echo
            echo '### Checksum'
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo "Built from this tag by [\`release.yml\`](../../blob/main/.github/workflows/release.yml)."
          } > notes.md
          # Re-pointing a tag re-runs this job, so publishing has to be repeatable:
          # update the release that is already there rather than failing on it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              "$DMG" "$DMG.sha256"
          fi
