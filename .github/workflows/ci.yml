name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # Ad-hoc signing (CODE_SIGN_IDENTITY "-") is set in the project, and the
      # unit tests need a real app bundle to host them, so signing stays on.
      - name: Build and test
        run: |
          xcodebuild test \
            -project PresentSafe.xcodeproj \
            -scheme PresentSafe \
            -destination 'platform=macOS'
